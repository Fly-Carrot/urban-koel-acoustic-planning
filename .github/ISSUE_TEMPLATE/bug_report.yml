name: Reproducibility or software bug
description: Report a failure without sharing sensitive data.
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What failed, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command and output
      description: Paste the minimal command and redacted output.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system and R version.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Sensitive-data check
      options:
        - label: I removed credentials, exact coordinates, raw audio and private paths.
          required: true
