name: verify
permissions:
  contents: read
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6
        with:
          r-version: '4.5.2'
      - run: make setup
      - run: make verify
      - run: make test
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verification-products
          path: |
            outputs/figures/verification_overview.pdf
            outputs/diagnostics/release_validation.csv
            outputs/tables/*.csv
            outputs/logs/*.csv
          if-no-files-found: error
          retention-days: 7
